<!DOCTYPE html>
<html lang="en">
<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>login</title>
       
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:ital,wght@0,100..900;1,100..900&family=Updock&display=swap" 
              rel="stylesheet">

       <link rel="stylesheet"
       href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>

       <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

       <link rel="stylesheet" href="../public/CSS/command.css">
       <link rel="stylesheet" href="../public/CSS/login.css">

       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
       crossorigin="anonymous" 
       referrerpolicy="no-referrer" />
</head>
<body>
       <div class="login_frame">
              <div class="container">
                     <div class="sign_in">
                            <div class="sign_name">
                                   <span>Sign In</span>
                            </div>
                            <div class="sign_username">
                                   <span>Username or email address</span>
                                   <input type="text" placeholder="Name...">
                            </div>
                            <div class="sign_password">
                                   <span>Password</span>
                                   <input type="text" placeholder="Password">
                            </div>
                            <div class="sign_inp">
                                   <input type="checkbox" >
                                   <span>Remember me</span>
                                   <strong><a href="../other/signup.html">Lost your password?</a></strong>
                            </div>
                            <div class="sign_login_btn">
                                   <span><a href="../other/contact.html">Login</a></span>
                            </div>
                            <div class="sign_create_acc">
                                   <span>Don't have an account? Create account</span>
                            </div>
                            <div class="sign_or"></div>
                            <div class="sign_buttons"></div>
                     </div>
              </div>
       </div>
</body>
</html>
